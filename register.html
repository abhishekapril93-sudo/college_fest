<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFest 2027 - Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>TechFest 2027</h1>
        <p>Registration</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="schedule.html">Schedule</a>
        <a href="register.html">Register</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>
        <section>
            <h2>Registration Form</h2>
            <form action="#" method="post">

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>

                <label for="department">Department:</label>
                <select id="department" name="department" required>
                    <option value="">-- Select Department --</option>
                    <option value="cse">Computer Science</option>
                    <option value="ece">Electronics &amp; Communication</option>
                    <option value="mech">Mechanical Engineering</option>
                    <option value="civil">Civil Engineering</option>
                    <option value="eee">Electrical Engineering</option>
                </select>

                <label>Year of Study:</label>
                <div class="radio-group">
                    <label><input type="radio" name="year" value="1" required> 1st Year</label>
                    <label><input type="radio" name="year" value="2"> 2nd Year</label>
                    <label><input type="radio" name="year" value="3"> 3rd Year</label>
                    <label><input type="radio" name="year" value="4"> 4th Year</label>
                </div>

                <label>Events you want to participate in:</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="events" value="codesprint"> Code Sprint</label>
                    <label><input type="checkbox" name="events" value="robowars"> Robo Wars</label>
                    <label><input type="checkbox" name="events" value="webdesign"> Web Design Challenge</label>
                    <label><input type="checkbox" name="events" value="aiworkshop"> AI Workshop</label>
                    <label><input type="checkbox" name="events" value="techquiz"> Tech Quiz</label>
                </div>

                <label for="message">Additional Comments:</label>
                <textarea id="message" name="message" placeholder="Any special requirements or questions..."></textarea>

                <button type="submit">Submit Registration</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2027 TechFest. All rights reserved.</p>
    </footer>
</body>
</html>
